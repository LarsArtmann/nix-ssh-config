name: Check

on:
  push:
    branches: [master]
  pull_request:
  # Weekly full gate before Monday's flake-lock PRs: catches nixpkgs
  # drift (new defaults, removed algorithms, sshd changes) on a schedule
  # instead of only when someone pushes.
  schedule:
    - cron: "17 4 * * 0" # Sundays 04:17 UTC
  workflow_dispatch:

jobs:
  check:
    # Pinned instead of ubuntu-latest: Nix builds must not silently change
    # runner image under a flaky glibc/kernel rollout; bump deliberately.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      # Caching is best-effort: if the cache action or its backend is down,
      # Nix still builds everything from cache.nixos.org and source — the
      # run gets slower, it does not go red (cache fallback policy).
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        continue-on-error: true
        with:
          # A public repo needs no FlakeHub auth; opting out removes the
          # per-run "Unable to authenticate to FlakeHub" warning noise.
          use-flakehub: false
      # --all-systems alone cannot BUILD foreign-system check derivations
      # (e.g. aarch64-darwin on an x86_64-linux runner -> "platform mismatch"),
      # so evaluate every system, then build+run the native checks only.
      - run: nix flake check --all-systems --no-build
      # The native gate builds the QEMU VM test: tee its transcript to a
      # file so a red run uploads the full driver log as an artifact
      # (PIPESTATUS keeps the nix exit code — the tee must not mask it).
      - run: |
          set -o pipefail
          nix flake check 2>&1 | tee /tmp/check-x86_64.log
      - run: nix fmt -- --fail-on-change
      - name: Check markdown links
        env:
          # Avoids api.github.com rate limits (429s) during link resolution.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: nix run nixpkgs#lychee -- --no-progress --max-retries 3 README.md CONTRIBUTING.md AGENTS.md CHANGELOG.md FEATURES.md ROADMAP.md TODO_LIST.md docs examples
      # Annotation grammar integrity — lint lives in
      # scripts/check-strikethrough.sh (single source for local + CI).
      - name: Check strikethrough balance in docs
        run: scripts/check-strikethrough.sh
      # A red VM run without its transcript repeats the ANSI/parse
      # debugging pain — keep the full driver log as an artifact.
      - name: Upload failure transcript
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: check-transcript-x86_64
          path: /tmp/check-x86_64.log
          if-no-files-found: ignore

  check-aarch64:
    # Native arm64 runner (free for public repos) so the aarch64-linux
    # checks, including QEMU-free eval assertions, build and run for real
    # instead of only being evaluated on x86_64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/magic-nix-cache-action@55718cd9ebf1737a061487d5ada21abf31e99a98 # main
        continue-on-error: true
        with:
          use-flakehub: false
      - run: nix flake check --all-systems --no-build
      - run: nix flake check
      - run: nix fmt -- --fail-on-change

  release-script:
    # Proves scripts/release.sh's guard logic in CI (plan 3 F51): the
    # v0.1.3 tag exists, so a DRY_RUN invocation must refuse with the
    # exact "already exists" failure — release tooling cannot silently
    # rot. fetch-depth: 0 pulls tags so the local tag check can fire.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: release.sh refuses an existing tag
        run: |
          set -o pipefail
          if DRY_RUN=1 ./scripts/release.sh 0.1.3 2>&1 | tee /tmp/release.log; then
            echo "release.sh unexpectedly succeeded — guard broken"
            exit 1
          fi
          grep -q "tag v0.1.3 already exists" /tmp/release.log

  checks-summary:
    # Single gate aggregating both architectures: branch protection can
    # require just this one check.
    needs: [check, check-aarch64]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if any architecture check failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more architecture checks failed"
            exit 1
          fi
          echo "All architecture checks passed"
