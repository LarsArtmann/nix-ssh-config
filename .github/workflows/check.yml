name: Check

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # --all-systems alone cannot BUILD foreign-system check derivations
      # (e.g. aarch64-darwin on an x86_64-linux runner -> "platform mismatch"),
      # so evaluate every system, then build+run the native checks only.
      - run: nix flake check --all-systems --no-build
      - run: nix flake check
      - run: nix fmt -- --fail-on-change
      - name: Check markdown links
        run: nix run nixpkgs#lychee -- --no-progress --max-retries 3 README.md CONTRIBUTING.md AGENTS.md CHANGELOG.md FEATURES.md ROADMAP.md TODO_LIST.md docs examples

  check-aarch64:
    # Native arm64 runner (free for public repos) so the aarch64-linux
    # checks, including QEMU-free eval assertions, build and run for real
    # instead of only being evaluated on x86_64.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: nix flake check --all-systems --no-build
      - run: nix flake check
      - run: nix fmt -- --fail-on-change
