name: Update flake.lock

# Weekly dependency freshness: opens (or updates) a PR bumping flake.lock.
# The PR is labeled and runs the Check workflow; merging is the maintainer's
# call. Also runnable manually via workflow_dispatch.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # main
        with:
          pr-title: "chore(deps): weekly nix flake update"
          pr-body: |
            Automated weekly `nix flake update`.

            Merge only if the Check workflow is green on this PR.
          pr-labels: |
            dependencies
            automated
          token: ${{ secrets.GITHUB_TOKEN }}
